    </text>
    <text x="320" y="104" text-anchor="middle"
      font-family="Arial Black, Impact, sans-serif"
      font-size="70" font-weight="900"
      fill="#fff7de" stroke="#fff7de" stroke-width="2" paint-order="stroke fill">
